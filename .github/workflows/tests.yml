name: tests

on:
  pull_request:
    branches: ['main', 'dev']

jobs:
  eslint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Check Node
        run: node -v && npm -v

      - name: Install and run
        run: | 
          npm ci
          npx nuxt prepare
          npx vitest