name: Lint

on:
  pull_request:
    branches: [main, dev]

jobs:
  eslint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: | 
          npm ci
          npx nuxt prepare
          npx eslint .